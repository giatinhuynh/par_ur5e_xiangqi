# manipulation_config.yaml
# Parameters for the Xiangqi manipulation stack.
#
# Gripper: OnRobot RG2 two-finger parallel gripper
#   - Max open width: 110 mm
#   - Max force: 40 N
#   - Controlled via Modbus TCP at EyeBox IP 10.234.6.47:502
#   - Xiangqi piece diameter: ~30 mm (plastic or wooden round pieces)
#
# Arm motion: lab's /par_moveit/waypoint_move action server (par_moveit_config)

manipulation_node:
  ros__parameters:
    simulation_mode: false
    # Gripper widths in millimetres
    open_width:    70.0   # Pre-grasp open (fingers clear a ~30 mm piece)
    grasp_width:   28.0   # Grip on ~30 mm piece (2 mm compression)
    release_width: 50.0   # Open to release at destination
    grasp_force:   15.0   # Gripping force in Newtons
    # Calibration file — used to derive scan pose from board centre automatically.
    # If absent or board_to_base_tf is missing, scan_pose_x/y below are used instead.
    calibration_file: "/home/rosuser/workspace/config/board_calibration.yaml"
    # Scan pose: top-down bird's-eye position for board vision scans.
    # scan_pose_z is the height ABOVE the board surface (metres) — always used.
    # scan_pose_x/y are fallback values used only when calibration is unavailable.
    # scan_pose_yaw: end-effector yaw (radians); 0.0 = straight down.
    scan_pose_x:   -0.40
    scan_pose_y:    0.00
    scan_pose_z:    0.55
    scan_pose_yaw:  0.0

gripper_controller_node:
  ros__parameters:
    simulation_mode: false
    gripper_ip:   "10.234.6.47"  # EyeBox IP (Modbus TCP to RG2)
    gripper_port: 502
    open_width:    70.0
    grasp_width:   28.0
    release_width: 50.0
    default_force: 15.0

safety_monitor_node:
  ros__parameters: {}
