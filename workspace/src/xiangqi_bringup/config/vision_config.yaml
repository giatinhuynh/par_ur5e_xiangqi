# vision_config.yaml: Vision node and board calibration parameters
vision_node:
  ros__parameters:
    model_path: "/home/rosuser/workspace/models/xiangqi_kaggle_v2_best.pt"
    calibration_file: "/home/rosuser/workspace/config/board_calibration.yaml"
    require_yolo_weights: true
    yolo_download_url: ""
    confidence_threshold: 0.5
    stability_frames: 5           # Frames to confirm a stable human move (~1.2s at 4Hz)
    poll_rate_hz: 4.0
    camera_topic: "/camera/camera/color/image_raw"
