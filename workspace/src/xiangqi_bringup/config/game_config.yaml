# game_config.yaml: Game Manager and AI Engine configuration
game_manager_node:
  ros__parameters:
    engine_type: "fairystockfish"    # "fairystockfish" | "minimax" | "mcts"
    # robot_plays_red: see robot_side.yaml (single source with task_planner_node)
    ai_time_limit: 5.0               # Seconds per AI move
    sim_ai_time_limit: 3.0           # Sim cap (was 1s - too weak for Stockfish)
    ai_depth: 0                      # 0 = use time limit instead
    # YOLO often misses pieces; allow fuzzy grid match when inferring human moves
    human_move_grid_tolerance: 12
    # After robot motion, commit AI move even if vision verify fails (hardware)
    trust_robot_move_after_verify_fail: true

ai_engine_node:
  ros__parameters:
    engine_type: "fairystockfish"
    difficulty: 20                   # Fairy-Stockfish skill level 1-20 (max)
    default_depth: 5
    default_time_limit: 5.0
    minimax_nnue_display_eval: true  # Dashboard cp from NNUE, not heuristic
    nnue_eval_movetime_ms: 120       # Shallow FSF search for Minimax display score
